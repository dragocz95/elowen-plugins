name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# These jobs only read the repository and run tests.
permissions:
  contents: read

jobs:
  test:
    name: Tests + bundle drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: registry
    env:
      ELOWEN_CORE_ROOT: ${{ github.workspace }}/core
      # Keep the vetted source commit aligned with the locked daemon release.
      ELOWEN_CORE_REF: 'e755706112b185c7bf1026ac6758e3747691854a'
    steps:
      - uses: actions/checkout@v7
        with:
          path: registry
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: registry/package-lock.json

      - name: Require a pinned core release commit
        run: node -e "if (!/^[0-9a-f]{40}$/.test(process.env.ELOWEN_CORE_REF ?? '')) throw new Error('ELOWEN_CORE_REF must pin the full released core commit SHA')"

      - uses: actions/checkout@v7
        with:
          repository: dragocz95/elowen
          ref: ${{ env.ELOWEN_CORE_REF }}
          path: core
          persist-credentials: false

      - run: npm ci

      - name: Match core source to the installed daemon
        run: node --input-type=module -e "import assert from 'node:assert/strict'; import { readFileSync } from 'node:fs'; import { join } from 'node:path'; const read = path => JSON.parse(readFileSync(path, 'utf8')); assert.equal(read(join(process.env.ELOWEN_CORE_ROOT, 'package.json')).version, read('node_modules/elowen/package.json').version, 'Core source must match the locked daemon release');"

      - name: Install core contract dependencies
        working-directory: core
        run: npm ci

      - name: Build core contract helpers
        working-directory: core
        run: npm run build:ts

      # Static analysis is the same mandatory gate developers run locally.
      - run: npm run check

      - run: npm test

      # A plugin's browser bundle is COMMITTED, because the Elowen marketplace installs a plugin by
      # copying files and never compiles anything — the committed web/index.js is the artifact users
      # actually run. Rebuilding it here and demanding an empty diff is the only thing standing between
      # "the source changed" and "the file everyone downloads still does the old thing".
      - run: npm run check:web

      # TypeScript plugin dist/ is installed just as directly as browser bundles and needs the same drift guard.
      - run: npm run check:dist

  e2e:
    name: E2E against the published daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Boots the REAL published `elowen` daemon from node_modules, installs the plugin into its data dir
      # the way the marketplace does, and drives it through a fake of the upstream chat service. This is
      # the only check that answers "does this plugin still work on the daemon people actually run" —
      # unit tests here load the plugin, but never watch a message travel end to end.
      - run: npm run test:e2e
